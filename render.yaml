services:
  - type: web
    name: seva-first-innovation
    env: python
    region: oregon
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn wsgi:app
    envVars:
      - key: FLASK_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.9.18
      - key: SECRET_KEY
        generateValue: true
